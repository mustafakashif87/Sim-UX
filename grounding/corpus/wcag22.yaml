- id: WCAG 3.3.7
  source: WCAG
  title: Redundant Entry
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/redundant-entry.html
  text: 'Information previously entered by or provided to the user that is required to be entered again
    in the same process is either: auto-populated, or available for the user to select. Except when: re-entering
    the information is essential, the information is required to ensure the security of the content, or
    previously entered information is no longer valid.'
  intent: The intent of this success criterion is to ensure that users can successfully complete multi-step
    processes.
  key_quote: 'Information previously entered by or provided to the user that is required to be entered
    again in the same process is either: auto-populated, or available for the user to select.'
- id: WCAG 3.3.1
  source: WCAG
  title: Error Identification
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html
  text: If an input error is automatically detected, the item that is in error is identified and the error
    is described to the user in text.
  intent: The intent of this success criterion is to ensure that users are aware that an error has occurred
    and can determine what is wrong.
  key_quote: If an input error is automatically detected, the item that is in error is identified and
    the error is described to the user in text.
- id: WCAG 3.3.3
  source: WCAG
  title: Error Suggestion
  level: AA
  url: https://www.w3.org/WAI/WCAG22/Understanding/error-suggestion.html
  text: If an input error is automatically detected and suggestions for correction are known, then the
    suggestions are provided to the user, unless it would jeopardize the security or purpose of the content.
  intent: The intent of this success criterion is to ensure that users receive appropriate suggestions
    for correction of an input error if it is possible.
  key_quote: If an input error is automatically detected and suggestions for correction are known, then
    the suggestions are provided to the user, unless it would jeopardize the security or purpose of the
    content.
- id: WCAG 3.3.4
  source: WCAG
  title: Error Prevention (Legal, Financial, Data)
  level: AA
  url: https://www.w3.org/WAI/WCAG22/Understanding/error-prevention-legal-financial-data.html
  text: 'For web pages that cause legal commitments or financial transactions for the user to occur, that
    modify or delete user-controllable data in data storage systems, or that submit user test responses,
    at least one of the following is true: Reversible Submissions are reversible. Checked Data entered
    by the user is checked for input errors and the user is provided an opportunity to correct them. Confirmed
    A mechanism is available for reviewing, confirming, and correcting information before finalizing the
    submission.'
  intent: The intent of this success criterion is to help users with disabilities avoid serious consequences
    as the result of a mistake when performing an action that cannot be reversed.
  key_quote: A mechanism is available for reviewing, confirming, and correcting information before finalizing
    the submission.
- id: WCAG 3.3.2
  source: WCAG
  title: Labels or Instructions
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html
  text: Labels or instructions are provided when content requires user input.
  intent: The intent of this success criterion is to have content authors present instructions or labels
    that identify the controls in a form so that users know what input data is expected.
  key_quote: Labels or instructions are provided when content requires user input.
- id: WCAG 2.4.2
  source: WCAG
  title: Page Titled
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/page-titled.html
  text: Web pages have titles that describe topic or purpose.
  intent: The intent of this success criterion is to help users find content and orient themselves within
    it by ensuring that each web page has a descriptive title.
  key_quote: Web pages have titles that describe topic or purpose.
- id: WCAG 2.4.6
  source: WCAG
  title: Headings and Labels
  level: AA
  url: https://www.w3.org/WAI/WCAG22/Understanding/headings-and-labels.html
  text: Headings and labels describe topic or purpose.
  intent: The intent of this success criterion is to help users understand what information is contained
    in web pages and how that information is organized.
  key_quote: Headings and labels describe topic or purpose.
- id: WCAG 3.1.5
  source: WCAG
  title: Reading Level
  level: AAA
  url: https://www.w3.org/WAI/WCAG22/Understanding/reading-level.html
  text: When text requires reading ability more advanced than the lower secondary education level after
    removal of proper names and titles, supplemental content, or a version that does not require reading
    ability more advanced than the lower secondary education level, is available.
  intent: Content should be written as clearly and simply as possible.
  key_quote: When text requires reading ability more advanced than the lower secondary education level
    after removal of proper names and titles, supplemental content, or a version that does not require
    reading ability more advanced than the lower secondary education level, is available.
- id: WCAG 1.1.1
  source: WCAG
  title: Non-text Content
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html
  text: All non-text content that is presented to the user has a text alternative that serves the equivalent
    purpose, except for the situations listed below. Controls, Input If non-text content is a control
    or accepts user input, then it has a name that describes its purpose. (Refer to Success Criterion
    4.1.2 for additional requirements for controls and content that accepts user input.) Time-Based Media
    If non-text content is time-based media, then text alternatives at least provide descriptive identification
    of the non-text content. (Refer to Guideline 1.2 for additional requirements for media.) Test If non-text
    content is a test or exercise that would be invalid if presented in text, then text alternatives at
    least provide descriptive identification of the non-text content. Sensory If non-text content is primarily
    intended to create a specific sensory experience, then text alternatives at least provide descriptive
    identification of the non-text content. CAPTCHA If the purpose of non-text content is to confirm that
    content is being accessed by a person rather than a computer, then text alternatives that identify
    and describe the purpose of the non-text content are provided, and alternative forms of CAPTCHA using
    output modes for different types of sensory perception are provided to accommodate different disabilities.
    Decoration, Formatting, Invisible If non-text content is pure decoration, is used only for visual
    formatting, or is not presented to users, then it is implemented in a way that it can be ignored by
    assistive technology.
  intent: The intent of this success criterion is to make information conveyed by non-text content accessible
    through the use of a text alternative.
  key_quote: All non-text content that is presented to the user has a text alternative that serves the
    equivalent purpose
- id: WCAG 1.3.1
  source: WCAG
  title: Info and Relationships
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
  text: Information, structure, and relationships conveyed through presentation can be programmatically
    determined or are available in text.
  intent: The intent of this success criterion is to ensure that information and relationships that are
    implied by visual or auditory formatting are preserved when the presentation format changes.
  key_quote: Information, structure, and relationships conveyed through presentation can be programmatically
    determined or are available in text.
- id: WCAG 2.1.1
  source: WCAG
  title: Keyboard
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
  text: All functionality of the content is operable through a keyboard interface without requiring specific
    timings for individual keystrokes, except where the underlying function requires input that depends
    on the path of the user's movement and not just the endpoints. Note 1 This exception relates to the
    underlying function, not the input technique. For example, if using handwriting to enter text, the
    input technique (handwriting) requires path-dependent input but the underlying function (text input)
    does not. Note 2 This does not forbid and should not discourage providing mouse input or other input
    methods in addition to keyboard operation.
  intent: The intent of this success criterion is to ensure that, wherever possible, content can be operated
    through a keyboard or keyboard interface (so an alternate keyboard can be used).
  key_quote: All functionality of the content is operable through a keyboard interface without requiring
    specific timings for individual keystrokes
- id: WCAG 2.1.2
  source: WCAG
  title: No Keyboard Trap
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html
  text: 'If keyboard focus can be moved to a component of the page using a keyboard interface, then focus
    can be moved away from that component using only a keyboard interface, and, if it requires more than
    unmodified arrow or tab keys or other standard exit methods, the user is advised of the method for
    moving focus away. Note Since any content that does not meet this success criterion can interfere
    with a user''s ability to use the whole page, all content on the web page (whether it is used to meet
    other success criteria or not) must meet this success criterion. See Conformance Requirement 5: Non-Interference.'
  intent: The intent of this success criterion is to ensure that content does not "trap" keyboard focus
    within subsections of content on a web page.
  key_quote: If keyboard focus can be moved to a component of the page using a keyboard interface, then
    focus can be moved away from that component using only a keyboard interface
- id: WCAG 4.1.2
  source: WCAG
  title: Name, Role, Value
  level: A
  url: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
  text: 'For all user interface components (including but not limited to: form elements, links and components
    generated by scripts), the name and role can be programmatically determined; states, properties, and
    values that can be set by the user can be programmatically set; and notification of changes to these
    items is available to user agents, including assistive technologies. Note This success criterion is
    primarily for web authors who develop or script their own user interface components. For example,
    standard HTML controls already meet this success criterion when used according to specification.'
  intent: The intent of this success criterion is to ensure that Assistive Technologies (AT) can gather
    appropriate information about, activate (or set) and keep up to date on the status of user interface
    controls in the content.
  key_quote: the name and role can be programmatically determined
