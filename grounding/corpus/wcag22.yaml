# WCAG 2.2 corpus: one entry per success criterion, text copied verbatim from the
# W3C "Understanding" page (the Success Criterion box and the first sentence of
# the Intent section). Retrieved 2026-10-12 from
# https://www.w3.org/WAI/WCAG22/Understanding/<slug>.html
