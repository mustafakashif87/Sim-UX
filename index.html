<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="SimUX — a proof-of-concept walkthrough of a multi-persona UI/UX auditor with a closed fix-and-verify loop. This is a click-through prototype of the finished product, not a running system."
    />
    <title>SimUX</title>

    <!-- SVG icon is the primary favicon for modern browsers (crisp at any
         tab size, matches BrandMark exactly). favicon.ico and
         apple-touch-icon.png (public/, generated from this same mark) cover
         browsers/contexts that don't resolve an inline SVG icon: legacy
         /favicon.ico lookups and mobile "Add to Home Screen". -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23241f2e'/%3E%3Ccircle cx='10' cy='16' r='2.6' fill='%23E6D9F5'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23F5D9E6'/%3E%3Ccircle cx='22' cy='16' r='2.6' fill='%23DCDCDC'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque replaces Archivo for all UI/heading text —
         Archivo is one of the most overused "default AI-template" sans
         faces right now; Bricolage has real character in its
         letterforms while staying fully professional. Instrument Serif
         (both styles requested via ital@0;1) is reserved for hero-scale
         headlines — its elegant, high-contrast italic is what lets a
         headline mix upright + italic for emphasis (see Hero.tsx),
         matching wisprflow.ai's own "Don't type, / just speak." device.
         Not used for regular body copy (Source Serif 4 keeps that job). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
