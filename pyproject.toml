[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simux"
version = "0.1.0"
description = "Multi-persona UI/UX auditor with code-enforced persona constraints"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "lefthook>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]
browser = [
    "playwright>=1.47",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
