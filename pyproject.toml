[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simux"
version = "0.1.0"
description = "Multi-persona UI/UX auditor with code-enforced persona constraints"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",  # FastAPI's TestClient, for tests/test_api.py
    "lefthook>=2.2.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
browser = [
    # Capped: perception parses Playwright's accessibility snapshot, whose format
    # can change between releases. Raise the cap through a pull request so CI runs.
    "playwright>=1.65.0,<1.66",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["agent*", "grounding*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import agent/, grounding/ and api/ from the checkout, so a package added after
# `pip install -e .` (e.g. grounding/) is found without reinstalling.
pythonpath = ["."]
addopts = "--ignore=tests/e2e"
