[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simux"
version = "0.1.0"
description = "Multi-persona UI/UX auditor with code-enforced persona constraints"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "lefthook>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]
browser = [
    # Capped: perception parses Playwright's accessibility snapshot, whose format
    # can change between releases. Raise the cap through a pull request so CI runs.
    "playwright>=1.47,<1.64",
]

[tool.setuptools.packages.find]
include = ["agent*", "grounding*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import agent/ and grounding/ from the checkout, so a package added after
# `pip install -e .` (e.g. grounding/) is found without reinstalling.
pythonpath = ["."]
addopts = "--ignore=tests/e2e"
