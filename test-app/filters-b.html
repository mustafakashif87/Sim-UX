<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kettles – SimShop</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    footer { max-width: 640px; margin: 24px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">SimShop</span>
    <nav aria-label="Site"><a href="index.html">All pages</a></nav>
  </header>
  <main>
    <h1>Kettles</h1>
    <form id="form" novalidate>
      <div class="row">
        <div class="field grow">
          <label for="min">Lowest price</label>
          <input type="text" id="min" inputmode="numeric">
        </div>
        <div class="field grow">
          <label for="max">Highest price</label>
          <input type="text" id="max" inputmode="numeric">
        </div>
      </div>
      <p id="error" class="error" role="alert"></p>
      <button type="submit">Apply filters</button>
    </form>
    <div id="result"></div>
  </main>
  <footer><a href="index.html">Help with filters</a></footer>
  <script>
    let sent = false;
    async function submit(url, body, done) {
      if (sent) return;  // links cannot be disabled
      sent = true;
      document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      await fetch(url, { method: 'POST', body });
      done();
    }
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const min = Number(document.getElementById('min').value);
      const max = Number(document.getElementById('max').value);
      if (!min || !max || min > max) {
        document.getElementById('error').textContent = 'Enter a lowest and a highest price.';
        return;
      }
      submit('api/filters', min + '-' + max, () => {
        document.getElementById('result').innerHTML = '<h2>Filters applied</h2>';
      });
    });
  </script>
</body>
</html>
