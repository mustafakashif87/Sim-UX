<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift cards – SimShop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="brand">SimShop</span>
    <nav aria-label="Site"><a href="index.html">All pages</a></nav>
  </header>
  <main>
    <h1>Redeem a gift card</h1>
    <p>Gift cards can be used on anything in the shop. They do not expire. You can use one card per order.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="code">Gift card code</label>
        <input type="text" id="code">
        <p class="hint" id="hint">Use the code from your email, not the one on your receipt.</p>
      </div>
      <p id="error" class="error" role="alert"></p>
      <button type="submit">Redeem</button>
    </form>
    <div id="result"></div>
  </main>
  <script>
    let sent = false;
    async function submit(url, body, done) {
      if (sent) return;  // links cannot be disabled
      sent = true;
      document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      await fetch(url, { method: 'POST', body });
      done();
    }
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim().toUpperCase();
      if (code !== 'GIFT-7731') {
        document.getElementById('error').textContent = 'That code cannot be redeemed.';
        return;
      }
      submit('api/redeem', code, () => {
        document.getElementById('form').hidden = true;
        document.getElementById('result').innerHTML = '<h2>Gift card added</h2>';
      });
    });
  </script>
</body>
</html>
