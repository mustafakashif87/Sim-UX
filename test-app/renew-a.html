<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimShop Plus – SimShop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="brand">SimShop</span>
    <nav aria-label="Site"><a href="index.html">All pages</a></nav>
  </header>
  <main>
    <h1>Renew SimShop Plus</h1>

    <form id="step1" class="step" novalidate>
      <h2 tabindex="-1">Step 1 of 3: Choose a plan</h2>
      <fieldset class="field">
        <legend>Plan</legend>
        <label><input type="radio" name="plan" value="monthly"> Monthly, $4 a month</label><br>
        <label><input type="radio" name="plan" value="yearly"> Yearly, $40 a year</label>
      </fieldset>
      <p id="error1" class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>

    <form id="step2" class="step" novalidate hidden>
      <h2 tabindex="-1">Step 2 of 3: Payment</h2>
      <fieldset class="field">
        <legend>Pay with</legend>
        <label><input type="radio" name="pay" value="card"> Saved card ending 4242</label><br>
        <label><input type="radio" name="pay" value="wallet"> SimShop wallet</label>
      </fieldset>
      <p id="error2" class="error" role="alert"></p>
      <button type="submit">Continue</button>
    </form>

    <form id="step3" class="step" novalidate hidden>
      <h2 tabindex="-1">Step 3 of 3: Confirm</h2>
      <div class="field">
        <label><input type="checkbox" id="agree" aria-describedby="error3"> I agree to the terms</label>
      </div>
      <p id="error3" class="error" role="alert"></p>
      <button type="submit">Renew</button>
    </form>

    <div id="result"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    function showStep(n) {
      document.querySelectorAll('.step').forEach((s) => { s.hidden = s.id !== 'step' + n; });
      $('step' + n).querySelector('h2').focus();
    }

    function picked(name, errorId, message) {
      const choice = document.querySelector(`input[name=${name}]:checked`);
      $(errorId).textContent = choice ? '' : message;
      return choice;
    }

    $('step1').addEventListener('submit', (e) => {
      e.preventDefault();
      if (picked('plan', 'error1', 'Choose a plan.')) showStep(2);
    });

    $('step2').addEventListener('submit', (e) => {
      e.preventDefault();
      if (picked('pay', 'error2', 'Choose how to pay.')) showStep(3);
    });

    $('step3').addEventListener('submit', async (e) => {
      e.preventDefault();
      const agree = $('agree');
      agree.removeAttribute('aria-invalid');
      if (!agree.checked) {
        agree.setAttribute('aria-invalid', 'true');
        $('error3').textContent = 'Tick the box to agree to the terms.';
        return;
      }
      $('error3').textContent = '';
      $('step3').querySelector('[type=submit]').disabled = true;
      const plan = document.querySelector('input[name=plan]:checked').value;
      await fetch('api/renew', { method: 'POST', body: plan });
      $('step3').hidden = true;
      $('result').innerHTML = '<h2>Membership renewed</h2>';
    });
  </script>
</body>
</html>
