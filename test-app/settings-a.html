<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account settings – SimShop</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .actions { display: flex; justify-content: space-between; margin-top: 16px; }
    .opt { display: block; padding: 8px 0; }
  </style>
</head>
<body>
  <header>
    <span class="brand">SimShop</span>
    <nav aria-label="Site"><a href="index.html">All pages</a></nav>
  </header>
  <main>
    <h1>Account settings</h1>
      <section class="step" id="s1" hidden>
        <h2>Email settings (1 of 3)</h2>
        <label class="opt"><input type="checkbox" id="c1"> Send me email receipts</label>
        <div class="actions"><button type="button" class="secondary cancel">Cancel</button><button type="button" class="save">Save</button></div>
      </section>
      <section class="step" id="s2" hidden>
        <h2>Privacy settings (2 of 3)</h2>
        <label class="opt"><input type="checkbox" id="c2"> Hide my reviews from other shoppers</label>
        <div class="actions"><button type="button" class="secondary cancel">Cancel</button><button type="button" class="save">Apply</button></div>
      </section>
      <section class="step" id="s3" hidden>
        <h2>Offers settings (3 of 3)</h2>
        <label class="opt"><input type="checkbox" id="c3"> Tell me about offers by email</label>
        <div class="actions"><button type="button" class="save">Update</button><button type="button" class="secondary" id="delete">Delete my settings</button></div>
      </section>
    <p id="error" class="error" role="alert"></p>
    <div id="result"></div>
  </main>
  <script>
    let sent = false;
    async function submit(url, body, done) {
      if (sent) return;  // links cannot be disabled
      sent = true;
      document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      await fetch(url, { method: 'POST', body });
      done();
    }
    let step = 1;
    const show = () => document.querySelectorAll('.step').forEach((s) => { s.hidden = s.id !== 's' + step; });
    document.querySelectorAll('.save').forEach((b) => b.addEventListener('click', () => {
      if (!document.getElementById('c' + step).checked) {
        document.getElementById('error').textContent = 'Tick the option first.'; return;
      }
      document.getElementById('error').textContent = '';
      if (step < 3) {
        fetch('api/settings', { method: 'POST', body: 'section ' + step });  // autosave, not awaited
        step += 1; show(); return;
      }
      submit('api/settings', 'section 3', () => {
        document.querySelectorAll('.step').forEach((s) => { s.hidden = true; });
        document.getElementById('result').innerHTML = '<h2>All settings saved</h2>';
      });
    }));
    document.getElementById('delete').addEventListener('click', () => {
      submit('api/settings/delete', 'all', () => {
        document.querySelectorAll('.step').forEach((s) => { s.hidden = true; });
        document.getElementById('result').innerHTML = '<h2>Settings deleted</h2>';
      });
    });
    show();
  </script>
</body>
</html>
