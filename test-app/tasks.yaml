# Agent tasks for the P1, P2 and P3 pages. One task per buggy/clean pair; both pages of
# a pair get the same task, so a difference in outcome comes from the page.
#
# Fields map to agent.loop.Task: `text` is what the model reads (it never
# names a bug), `goal` is the harness-side success check (a visible element
# with this role and name), `endpoint` is the URL glob the harness answers
# with 200. Build `url` from the host plus each entry in `pages`.
#
# Which page of a pair is buggy is recorded only in SEEDED_BUGS.md.
# check_seeds.py drives every task's happy path on both pages and fails if
# the goal is not reached.

- id: signup
  pages: [signup-a.html, signup-b.html]
  text: Create an account for Sam Khan with the email address sam.khan@example.com.
  goal: {role: heading, name: Account created}
  endpoint: "**/api/signup"

- id: subscribe
  pages: [subscribe-a.html, subscribe-b.html]
  text: Subscribe to the weekly deals email with the address sam.khan@example.com.
  goal: {role: heading, name: Subscribed}
  endpoint: "**/api/subscribe"

- id: callback
  pages: [callback-a.html, callback-b.html]
  text: Request a callback for Sam Khan on phone number 03001234567.
  goal: {role: heading, name: Callback requested}
  endpoint: "**/api/callback"

- id: order
  pages: [order-a.html, order-b.html]
  text: Place the order for the kettle in your basket.
  goal: {role: heading, name: Order placed}
  endpoint: "**/api/orders"

- id: account
  pages: [account-a.html, account-b.html]
  text: Delete your SimShop account.
  goal: {role: heading, name: Account deleted}
  endpoint: "**/api/account/delete"

- id: checkout
  pages: [checkout-a.html, checkout-b.html]
  text: >-
    Buy the kettle with standard delivery to Sam Khan, 12 Canal Road, Lahore.
    Your billing address is the same as your delivery address.
  goal: {role: heading, name: Thank you for your order}
  endpoint: "**/api/checkout"

# P2 Memoryless first-time user (B7 to B9)

- id: returns
  pages: [returns-a.html, returns-b.html]
  text: Return the stainless steel kettle, because it arrived damaged.
  goal: {role: heading, name: Return booked}
  endpoint: "**/api/returns"

- id: renew
  pages: [renew-a.html, renew-b.html]
  text: Renew your SimShop Plus membership for a year and pay with your saved card.
  goal: {role: heading, name: Membership renewed}
  endpoint: "**/api/renew"

- id: upgrade
  pages: [upgrade-a.html, upgrade-b.html]
  text: Change your plan to Family, paid every month.
  goal: {role: heading, name: Plan changed}
  endpoint: "**/api/plan"

# P3 Low-literacy or non-native reader (B10 to B12)

- id: transfer
  pages: [transfer-a.html, transfer-b.html]
  text: Send 500 rupees from your wallet to account number 12345678.
  goal: {role: heading, name: Money sent}
  endpoint: "**/api/transfer"

- id: cancel
  pages: [cancel-a.html, cancel-b.html]
  text: End your SimShop Plus membership.
  goal: {role: heading, name: Membership ended}
  endpoint: "**/api/cancel"

- id: phone
  pages: [phone-a.html, phone-b.html]
  text: Save the phone number 0300 1234567 to your SimShop account.
  goal: {role: heading, name: Phone number saved}
  endpoint: "**/api/phone"

# Extension personas P4, P5, P7 and P8 (B13 to B17, B20 to B25).
# critical_text is for the P8 detectors only; the model never sees it.

- id: feedback
  pages: [feedback-a.html, feedback-b.html]
  text: "Send SimShop this feedback: Fast delivery, thank you."
  goal: {role: button, name: Send more feedback}
  endpoint: "**/api/feedback"

- id: size
  pages: [size-a.html, size-b.html]
  text: Add the running trainers in size UK 8 to your basket.
  goal: {role: heading, name: Added to basket}
  endpoint: "**/api/basket"

- id: policy
  pages: [policy-a.html, policy-b.html]
  text: Accept the updated privacy policy.
  goal: {role: heading, name: Policy accepted}
  endpoint: "**/api/policy"

- id: filters
  pages: [filters-a.html, filters-b.html]
  text: Show the kettles priced from 20 to 50 dollars.
  goal: {role: heading, name: Filters applied}
  endpoint: "**/api/filters"

- id: login
  pages: [login-a.html, login-b.html]
  text: Log in with the email address sam.khan@example.com and the password Kettle-2026.
  goal: {role: heading, name: Welcome back}
  endpoint: "**/api/login"

- id: invoice
  pages: [invoice-a.html, invoice-b.html]
  text: Pay invoice INV-2207.
  goal: {role: heading, name: Invoice paid}
  endpoint: "**/api/invoice"

- id: profile
  pages: [profile-a.html, profile-b.html]
  text: Change your display name to Sam K.
  goal: {role: heading, name: Profile saved}
  endpoint: "**/api/profile"

- id: notice
  pages: [notice-a.html, notice-b.html]
  text: Renew your parking permit before it ends.
  goal: {role: heading, name: Renewal requested}
  endpoint: "**/api/permit"

- id: redeem
  pages: [redeem-a.html, redeem-b.html]
  text: >-
    Redeem your SimShop gift card. Your email gives the code GIFT-7731 and
    your receipt shows the code RCPT-5520.
  goal: {role: heading, name: Gift card added}
  endpoint: "**/api/redeem"
  critical_text: Use the code from your email, not the one on your receipt.

- id: trial
  pages: [trial-a.html, trial-b.html]
  text: Start a free trial of SimShop Plus.
  goal: {role: heading, name: Trial started}
  endpoint: "**/api/trial"
  critical_text: Start free trial

- id: pricing
  pages: [pricing-a.html, pricing-b.html]
  text: Choose the Family plan, paid once a year.
  goal: {role: heading, name: Annual Family plan chosen}
  endpoint: "**/api/plan"
