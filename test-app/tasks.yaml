- id: renew
  pages: [renew-a.html, renew-b.html]
  text: Renew your SimShop Plus membership for a year and pay with your saved card.
  goal: {role: heading, name: Membership renewed}
  endpoint: "**/api/renew"

- id: upgrade
  pages: [upgrade-a.html, upgrade-b.html]
  text: Change your plan to Family, paid every month.
  goal: {role: heading, name: Plan changed}
  endpoint: "**/api/plan"

# P3 Low-literacy or non-native reader (B10 to B12)

- id: transfer
  pages: [transfer-a.html, transfer-b.html]
