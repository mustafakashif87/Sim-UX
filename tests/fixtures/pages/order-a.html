<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout</title>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <p>Stainless steel kettle, $39.00</p>
    <button type="button" id="place">Place order</button>
    <div id="result"></div>
  </main>
  <script>
    const button = document.getElementById('place');
    button.addEventListener('click', async () => {

      await fetch('https://fixture.test/api/orders', { method: 'POST', body: 'kettle' });
      document.getElementById('result').innerHTML = '<h2>Order placed</h2>';
    });
  </script>
</body>
</html>
